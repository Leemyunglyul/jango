      async function offer(filename, data) {
        /* 아티팩트에서는 downloads 캐퍼빌리티, 일반 웹에서는 Blob 다운로드 */
        let dl = null;
        try {
          dl =
            window.claude && window.claude.use
              ? await window.claude.use("downloads")
              : null;
        } catch (e) {}
        if (dl) {
          try {
            await dl.save({ filename, data });
            toast("저장했어요");
          } catch (e) {
            if (!(e && e.code === "declined")) toast("저장하지 못했어요");
          }
          return;
        }
        try {
          const blob =
            data instanceof Blob
              ? data
              : new Blob([data], { type: "application/octet-stream" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = filename;
          a.style.display = "none";
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1500);
          toast("내려받았어요");
        } catch (e) {
          toast("저장하지 못했어요");
        }
      }

        if (t.id === "syncSetup") {

          return;

        if (t.id === "syncChip") {

          return;
        }
        if (t.id === "syncPush") {
          dirty.clear();
          pushSheet(true).then(() => {
            render();
            toast("시트에 올렸어요");
          });
          return;
        }
        if (t.id === "syncPull") {
          setSync("busy");
          gasCall({ action: "load" })
            .then((j) => {
              if (adoptRemote(j.data, j.rev)) {
                render();
                toast("시트에서 내려받았어요");
                setSync("ok", Date.now());
              } else {

            });
          return;
        }
        if (t.id === "syncOff") {
          SYNC.url = "";
          SYNC.token = "";
          saveSyncCfg();
          setSync("off");
          render();
          toast("연결을 해제했어요");
          return;
        }
        if (t.id === "doImport") {
          openImport();
          return;

          return;

            `<h3>전체 초기화</h3><div class="note" style="margin-bottom:16px">모든 기록·자산·설정이 지워지고 처음 상태(8·9월 엑셀 이월본)로 돌아가요. 되돌릴 수 없습니다.</div>
      <div class="stack"><button class="btn danger" id="r_yes">네, 초기화할게요</button><button class="btn ghost" id="r_no">취소</button></div>`,
            () => {
              $("#r_no").onclick = closeSheet;
              $("#r_yes").onclick = () => {
                S = seed();
                persist(
                  "settings",

                  "snaps",
                  "rec",
                  ...Object.keys(S.months).map((m) => "month:" + m),

                closeSheet();
                render();
                toast("초기화했어요");

          );

        }
      });
      $("#scrim").addEventListener("click", closeSheet);

      /* ══════════ 키보드 ══════════
   데스크톱에서 마우스로 숫자패드를 누르는 대신 그냥 타이핑한다.
   한글 입력 상태에서도 동작하도록 e.key와 e.code를 같이 본다. */
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && sheetOpen) {
          closeSheet();
          return;
        }
        if (sheetOpen) return;
        if (e.metaKey || e.ctrlKey || e.altKey) return;

        const el = e.target,
          tag = (el.tagName || "").toLowerCase();
        const typing =
          tag === "input" ||
          tag === "textarea" ||
          tag === "select" ||
          el.isContentEditable;

        // 입력칸 안에서: Enter는 기록, Esc는 비우기
        if (typing) {
          if (e.key === "Enter" && (el.id === "memo" || el.id === "amt")) {
            e.preventDefault();
            const m = $("#memo");
            if (m) UI.memo = m.value;
            if (UI.amount) saveTx();
            else {
              const a = $("#amt");
              if (a) a.focus();
            }
          } else if (e.key === "Escape" && el.id === "amt") {
            e.preventDefault();
            setAmount(0);
          }
          return;
        }

        const code = e.code || "";
        if (e.key === "[" || code === "BracketLeft") {
          e.preventDefault();
          UI.month = shiftYM(UI.month, -1);
          render();
          return;
        }
        if (e.key === "]" || code === "BracketRight") {
          e.preventDefault();
          UI.month = shiftYM(UI.month, 1);
          render();
          return;
        }
        if (UI.tab !== "record") return;

        /* 아무 데나 눌러도 숫자면 금액칸으로 보낸다 */
        let digit = null;
        if (/^[0-9]$/.test(e.key)) digit = e.key;
        else {
          const m = /^(?:Digit|Numpad)([0-9])$/.exec(code);
          if (m) digit = m[1];
        }
        if (digit !== null) {
          const a = $("#amt");
          if (a) {
            e.preventDefault();
            a.focus();
            setAmount(UI.amount * 10 + Number(digit));
          }
          return;
        }
        if (e.key === "Enter" || e.key === "NumpadEnter") {
          e.preventDefault();
          if (UI.amount) {
            const m = $("#memo");
            if (m) UI.memo = m.value;
            saveTx();
          }
          return;
        }
        if (e.key === "Escape") {
          e.preventDefault();
          setAmount(0);
          return;
        }
        if (code === "KeyM") {
          e.preventDefault();
          const m = $("#memo");
          if (m) {
            m.focus();
            m.select();
          }
          return;
        }
        if (code === "KeyT") {
          e.preventDefault();
          UI.kind = UI.kind === "ex" ? "in" : "ex";
          UI.once = false;
          render();
          return;
        }
      });
      document.addEventListener("change", (e) => {
        if (e.target.id === "dpick") {
          UI.date = e.target.value || todayISO();

      });

        lastW = window.innerWidth;
      window.addEventListener("resize", () => {
        if (Math.abs(window.innerWidth - lastW) < 40) return;
        lastW = window.innerWidth;
        clearTimeout(rzTimer);
        rzTimer = setTimeout(() => {
          if (!sheetOpen) render();
        }, 220);
      });

      /* 차트 툴팁 */
      const tipEl = $("#tip");
      function showTip(el, ev) {
        let p;
        try {
          p = JSON.parse(el.dataset.tip);
        } catch (e) {
          return;
        }
        tipEl.hidden = false;
        tipEl.innerHTML =
          `<div class="th">${esc(p.t)}</div>` +
          p.rows
            .map(
              (r) =>
                `<div class="tr"><i style="background:${r[2]}"></i><span>${esc(r[0])}</span><b>${won(r[1])}</b></div>`,
            )
            .join("");
        const r = el.getBoundingClientRect();
        const w = tipEl.offsetWidth,
          h = tipEl.offsetHeight;
        let x = r.left + r.width / 2 - w / 2,
          y = r.top - h - 8;
        x = Math.max(8, Math.min(window.innerWidth - w - 8, x));
        if (y < 8) y = r.bottom + 8;
        tipEl.style.left = x + "px";
        tipEl.style.top = y + "px";
        tipEl.classList.add("on");
      }
      function hideTip() {
        tipEl.classList.remove("on");
        setTimeout(() => {
          if (!tipEl.classList.contains("on")) tipEl.hidden = true;
        }, 150);
      }
      document.addEventListener("pointerover", (e) => {
        const h = e.target.closest?.("[data-tip]");
        if (h) showTip(h, e);
      });
      document.addEventListener("pointerout", (e) => {
        if (e.target.closest?.("[data-tip]")) hideTip();
      });
      document.addEventListener("pointerdown", (e) => {
        const h = e.target.closest?.("[data-tip]");
        if (h) showTip(h, e);
        else hideTip();
      });

      /* ============================== 부트 ============================== */
      applyTheme();
      S = loadLocal();
      if (!S.settings.quick) S.settings.quick = SEED_SETTINGS.quick;
      if (!S.snaps) S.snaps = {};
      if (!S.assets) S.assets = structuredClone(SEED_ASSETS);
      if (S.rev == null) S.rev = 0;
      if (migrate()) persist("assets", "snaps");
      loadSyncCfg();
      render();
      setSync(SYNC.url ? "busy" : "off");
      if (SYNC.url) syncBoot();
      else if (window.claude && window.claude.use) connectDB();
      if ("serviceWorker" in navigator && location.protocol === "https:") {
        window.addEventListener("load", () =>
          navigator.serviceWorker.register("./sw.js").catch(() => {}),
        );
      }
    </script>
  </body>
</html>
