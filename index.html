<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta
      name="theme-color"
      content="#F6F5F0"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#131512"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="잔고와 흐름" />
    <meta
      name="description"
      content="숫자패드로 3초에 기록하는 개인 가계부 · 자산 트래커"
    />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <style>
      html {
        color-scheme: light dark;
      }
      body {
        margin: 0;
      }
      img {
        max-width: 100%;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <title>잔고와 흐름</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
      :root {
        --ground: #f6f5f0;
        --surface: #fcfcfb;
        --surface2: #f1f0e9;
        --raise: #ffffff;
        --line: #e2e0d5;
        --line-soft: #edebe2;
        --ink: #1c2320;
        --ink2: #5e6862;
        --ink3: #8c948e;
        --accent: #0f7b5e;
        --expense: #c75c0a;
        --invest: #2e5fcb;
        --good: #0f7b5e;
        --warn: #a8790c;
        --crit: #b4351e;
        --chip: #eae8de;
        --shadow:
          0 1px 2px rgba(28, 35, 32, 0.06), 0 8px 24px rgba(28, 35, 32, 0.05);
        --sheet-shadow: 0 -8px 40px rgba(28, 35, 32, 0.18);
        --focus: #0f7b5e;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --ground: #131512;
          --surface: #1b1e1a;
          --surface2: #21251f;
          --raise: #242821;
          --line: #2f342c;
          --line-soft: #262a23;
          --ink: #e7eae3;
          --ink2: #9ba69d;
          --ink3: #6e7970;
          --accent: #2aa57d;
          --expense: #d8791f;
          --invest: #5b92e6;
          --good: #2aa57d;
          --warn: #c79a31;
          --crit: #de6a50;
          --chip: #2b302a;
          --shadow:
            0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
          --sheet-shadow: 0 -8px 40px rgba(0, 0, 0, 0.5);
          --focus: #2aa57d;
        }
      }
      :root[data-theme="dark"] {
        --ground: #131512;
        --surface: #1b1e1a;
        --surface2: #21251f;
        --raise: #242821;
        --line: #2f342c;
        --line-soft: #262a23;
        --ink: #e7eae3;
        --ink2: #9ba69d;
        --ink3: #6e7970;
        --accent: #2aa57d;
        --expense: #d8791f;
        --invest: #5b92e6;
        --good: #2aa57d;
        --warn: #c79a31;
        --crit: #de6a50;
        --chip: #2b302a;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
        --sheet-shadow: 0 -8px 40px rgba(0, 0, 0, 0.5);
        --focus: #2aa57d;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--ground);
        color: var(--ink);
        font-family:
          "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui,
          sans-serif;
        font-size: 15px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        padding-bottom: calc(74px + env(safe-area-inset-bottom));
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
        background: none;
        border: none;
        padding: 0;
      }
      :focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
        border-radius: 6px;
      }
      .num {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-variant-numeric: tabular-nums;
      }
      .serif {
        font-family: "Hahmlet", "Apple SD Gothic Neo", serif;
      }

      /* ---------- shell ---------- */
      .app {
        max-width: 560px;
        margin: 0 auto;
        padding: 0 16px;
      }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        background: var(--ground);
        border-bottom: 1px solid var(--line-soft);
      }
      .topbar-in {
        max-width: 560px;
        margin: 0 auto;
        padding: 12px 16px 10px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .brand {
        font-family: "Hahmlet", serif;
        font-weight: 600;
        font-size: 17px;
        letter-spacing: -0.01em;
        white-space: nowrap;
      }
      .brand .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        margin-right: 7px;
        vertical-align: 2px;
      }
      .topright {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .month-nav {
        display: flex;
        align-items: center;
        gap: 2px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 2px;
      }
      .month-nav button {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        color: var(--ink2);
        display: grid;
        place-items: center;
        font-size: 14px;
      }
      .month-nav button:hover {
        background: var(--chip);
        color: var(--ink);
      }
      .month-nav .m {
        padding: 0 6px;
        font-size: 13.5px;
        font-weight: 500;
        min-width: 62px;
        text-align: center;
      }
      .iconbtn {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 1px solid var(--line);
        background: var(--surface);
        display: grid;
        place-items: center;
        color: var(--ink2);
        flex: none;
      }
      .iconbtn:hover {
        color: var(--ink);
        border-color: var(--ink3);
      }
      .iconbtn svg {
        width: 15px;
        height: 15px;
        display: block;
      }
      .syncchip {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 11.5px;
        font-weight: 500;
        color: var(--ink2);
        padding: 4px 9px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--surface);
        white-space: nowrap;
      }
      .syncchip::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--ink3);
        flex: none;
      }
      .syncchip[data-s="ok"]::before {
        background: var(--accent);
      }
      .syncchip[data-s="busy"]::before {
        background: var(--warn);
        animation: pulse 1s ease-in-out infinite;
      }
      .syncchip[data-s="err"] {
        color: var(--crit);
        border-color: color-mix(in srgb, var(--crit) 40%, transparent);
      }
      .syncchip[data-s="err"]::before {
        background: var(--crit);
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }
      @media (max-width: 400px) {
        .syncchip span {
          display: none;
        }
      }

      nav.tabs {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 30;
        background: color-mix(in srgb, var(--ground) 92%, transparent);
        backdrop-filter: blur(12px);
        border-top: 1px solid var(--line);
      }
      nav.tabs {
        padding-bottom: env(safe-area-inset-bottom);
      }
      .tabs-in {
        max-width: 560px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
      }
      .tabs button {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        padding: 9px 0 11px;
        min-height: 58px;
        font-size: 11.5px;
        color: var(--ink3);
        font-weight: 500;
        position: relative;
        -webkit-tap-highlight-color: transparent;
      }
      .tabs button svg {
        width: 23px;
        height: 23px;
        display: block;
      }
      .tabs button:active {
        background: var(--surface2);
      }
      .tabs button[aria-current="page"] {
        color: var(--accent);
        font-weight: 600;
      }
      .tabs button[aria-current="page"]::before {
        content: "";
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 30px;
        height: 2.5px;
        background: var(--accent);
        border-radius: 0 0 3px 3px;
      }
      #navSettings {
        display: none;
      }
      /* ── 다단 레이아웃 (모바일에서는 전부 한 줄로 흐름) ── */
      .cols {
        display: block;
      }
      .cols > div {
        min-width: 0;
      }
      .setgrid {
        display: block;
      }
      .assetgrid {
        display: block;
      }
      .cols > div > h2.sec:first-child {
        margin-top: 26px;
      }
      .setblk > h2.sec {
        margin-top: 26px;
      }
      .kbdhint {
        display: none;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
        font-size: 12px;
        color: var(--ink3);
        margin-top: 12px;
      }
      .kbdhint span {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .kbdhint kbd {
        font-family: "IBM Plex Mono", monospace;
        font-size: 11px;
        line-height: 1.4;
        background: var(--surface2);
        border: 1px solid var(--line);
        border-bottom-width: 2px;
        border-radius: 5px;
        padding: 1px 6px;
        color: var(--ink2);
      }

      @media (min-width: 920px) {
        body {
          padding-bottom: 0;
        }
        .shell {
          display: grid;
          grid-template-columns: 210px minmax(0, 1fr);
          gap: 32px;
          max-width: 1000px;
          margin: 0 auto;
          padding: 0 24px;
        }
        nav.tabs {
          position: sticky;
          top: 64px;
          bottom: auto;
          background: none;
          backdrop-filter: none;
          border: none;
          align-self: start;
          height: max-content;
          padding-top: 16px;
        }
        .tabs-in {
          grid-template-columns: 1fr;
          gap: 2px;
        }
        .tabs button {
          flex-direction: row;
          justify-content: flex-start;
          gap: 11px;
          text-align: left;
          padding: 10px 13px;
          border-radius: 9px;
          font-size: 14px;
          min-height: 0;
        }
        .tabs button svg {
          width: 18px;
          height: 18px;
        }
        .tabs button[aria-current="page"] {
          background: var(--surface2);
          color: var(--ink);
        }
        .tabs button[aria-current="page"] svg {
          color: var(--accent);
        }
        .tabs button[aria-current="page"]::before {
          top: 50%;
          left: 0;
          transform: translateY(-50%);
          width: 2.5px;
          height: 18px;
          border-radius: 0 3px 3px 0;
        }
        #navSettings {
          display: flex;
          margin-top: 12px;
          padding-top: 16px;
          border-top: 1px solid var(--line-soft);
          border-radius: 0 0 9px 9px;
        }
        #gearBtn {
          display: none;
        }
        .app {
          max-width: 100%;
          padding: 0 0 60px;
          min-width: 0;
        }
        .topbar-in {
          max-width: 1000px;
          padding: 14px 24px 12px;
        }
      }
      section {
        padding: 18px 0 8px;
      }
      h2.sec {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink3);
        margin: 26px 0 10px;
      }
      h2.sec:first-child {
        margin-top: 6px;
      }

      /* ---------- cards / ledger ---------- */
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
      }
      .pad {
        padding: 16px;
      }
      .rows {
        display: flex;
        flex-direction: column;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 11px 14px;
        border-bottom: 1px solid var(--line-soft);
        text-align: left;
        width: 100%;
      }
      .row:last-child {
        border-bottom: none;
      }
      .row:hover {
        background: var(--surface2);
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex: none;
      }
      .row .grow {
        overflow: hidden;
      }
      /* inline 요소는 overflow가 안 먹어서 말줄임이 안 된다 → inline-block으로 */
      .row .nm {
        font-weight: 500;
        display: inline-block;
        max-width: 100%;
        vertical-align: bottom;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .row .mm {
        color: var(--ink3);
        font-size: 12.5px;
        display: inline-block;
        max-width: 100%;
        vertical-align: bottom;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* 설정 화면의 설명글은 잘리는 대신 두 줄로 */
      .setblk .row .nm {
        display: block;
      }
      .setblk .row .mm {
        display: block;
        white-space: normal;
        overflow: visible;
        margin-top: 2px;
        line-height: 1.45;
      }
      .row .amt {
        margin-left: auto;
        font-weight: 500;
        white-space: nowrap;
      }
      .grow {
        min-width: 0;
        flex: 1;
      }
      .tag {
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.03em;
        padding: 2px 6px;
        border-radius: 5px;
        background: var(--chip);
        color: var(--ink2);
        flex: none;
      }
      .tag.once {
        background: color-mix(in srgb, var(--warn) 16%, transparent);
        color: var(--warn);
      }
      .daymark {
        padding: 14px 14px 6px;
        font-size: 12px;
        font-weight: 600;
        color: var(--ink3);
        letter-spacing: 0.03em;
        border-bottom: 1px solid var(--line-soft);
        background: var(--surface2);
      }
      .empty {
        padding: 34px 16px;
        text-align: center;
        color: var(--ink3);
        font-size: 13.5px;
        line-height: 1.7;
      }

      /* ---------- record ---------- */
      .amount-stage {
        padding: 14px 4px 6px;
      }
      .seg {
        display: inline-flex;
        background: var(--surface2);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 3px;
        gap: 2px;
        margin-bottom: 4px;
      }
      .seg button {
        padding: 8px 22px;
        border-radius: 999px;
        font-size: 14px;
        font-weight: 500;
        color: var(--ink2);
      }
      .seg button[aria-pressed="true"] {
        background: var(--raise);
        color: var(--ink);
        box-shadow: var(--shadow);
        font-weight: 600;
      }
      .kindtoggle {
        display: inline-flex;
        background: var(--surface2);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 3px;
        gap: 2px;
      }
      .kindtoggle button {
        padding: 5px 16px;
        border-radius: 999px;
        font-size: 13.5px;
        font-weight: 500;
        color: var(--ink2);
      }
      .kindtoggle button[aria-pressed="true"] {
        background: var(--raise);
        color: var(--ink);
        box-shadow: var(--shadow);
        font-weight: 600;
      }
      .bigamt {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin: 12px 0 2px;
        padding-bottom: 7px;
        border-bottom: 1.5px solid var(--line);
        transition: border-color 0.15s;
        cursor: text;
      }
      .bigamt:focus-within {
        border-bottom-color: var(--accent);
      }
      .bigamt .w {
        font-family: "IBM Plex Sans KR", sans-serif;
        font-size: 19px;
        font-weight: 500;
        color: var(--ink2);
        flex: none;
      }
      .amtinput {
        font-family: "Hahmlet", "Apple SD Gothic Neo", serif;
        font-variant-numeric: tabular-nums;
        font-size: clamp(40px, 13vw, 54px);
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.15;
        background: none;
        border: none;
        padding: 0;
        margin: 0;
        width: 100%;
        min-width: 0;
        caret-color: var(--accent);
        -webkit-appearance: none;
      }
      /* 지원하는 브라우저에서는 숫자 길이만큼만 차지해서 '원'이 숫자 바로 옆에 붙는다.
   미지원 브라우저는 full width — 어차피 <label>이라 어디를 눌러도 포커스된다. */
      @supports (field-sizing: content) {
        .amtinput {
          field-sizing: content;
          width: auto;
          min-width: 1.2ch;
        }
      }
      .amtinput::placeholder {
        color: var(--ink3);
        opacity: 1;
      }
      .amtinput:focus {
        outline: none;
      }
      .datepick {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--ink2);
        font-size: 13px;
      }
      .datepick input {
        background: none;
        border: none;
        color: var(--ink2);
        font-size: 13px;
        padding: 2px 0;
      }
      .quicks {
        display: flex;
        gap: 7px;
        overflow-x: auto;
        padding: 2px 0 4px;
        scrollbar-width: none;
      }
      .quicks::-webkit-scrollbar {
        display: none;
      }
      .quick {
        border: 1px solid var(--line);
        background: var(--surface);
        border-radius: 999px;
        padding: 7px 12px;
        font-size: 13px;
        white-space: nowrap;
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .quick:hover {
        border-color: var(--accent);
      }
      .quick b {
        font-weight: 500;
        color: var(--ink3);
        font-family: "IBM Plex Mono", monospace;
      }
      .catgrid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 7px;
      }
      @media (min-width: 520px) {
        .catgrid {
          grid-template-columns: repeat(5, 1fr);
        }
      }
      .cat {
        border: 1px solid var(--line);
        background: var(--surface);
        border-radius: 10px;
        padding: 10px 5px;
        word-break: keep-all;
        font-size: 12.5px;
        font-weight: 500;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        line-height: 1.25;
        min-height: 56px;
        justify-content: center;
        text-align: center;
      }
      .cat .dot {
        width: 7px;
        height: 7px;
      }
      .cat[aria-pressed="true"] {
        border-color: currentColor;
        background: var(--surface2);
        font-weight: 600;
        box-shadow: inset 0 0 0 1px currentColor;
      }
      .memoinput {
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 11px 13px;
        font-size: 14px;
      }
      .memoinput::placeholder {
        color: var(--ink3);
      }
      .btn {
        display: block;
        width: 100%;
        text-align: center;
        padding: 14px;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 600;
        background: var(--accent);
        color: #fff;
      }
      .btn[disabled] {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .btn.ghost {
        background: var(--surface);
        border: 1px solid var(--line);
        color: var(--ink);
        font-weight: 500;
      }
      .btn.danger {
        background: none;
        border: 1px solid color-mix(in srgb, var(--crit) 40%, transparent);
        color: var(--crit);
      }
      .btn.sm {
        padding: 9px 14px;
        font-size: 13.5px;
        width: auto;
        display: inline-block;
        border-radius: 9px;
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .hstack {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .switchline {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 11px 14px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        font-size: 13.5px;
      }
      .switchline .hint {
        color: var(--ink3);
        font-size: 12px;
      }
      .sw {
        margin-left: auto;
        width: 42px;

      function migrate() {

          return;

        el.hidden = false;
        el.dataset.s = state;
        const t = SYNC.at ? new Date(SYNC.at) : null;
        const hhmm = t
          ? String(t.getHours()).padStart(2, "0") +
            ":" +
            String(t.getMinutes()).padStart(2, "0")
          : "";
        el.innerHTML =
          {
            busy: "<span>동기화 중</span>",
            ok: "<span>시트 " + hhmm + "</span>",
            err: "<span>동기화 실패</span>",
          }[state] || "<span>시트</span>";
        el.title = state === "err" ? "눌러서 설정 확인" : "구글 시트에 저장됨";
      }

      async function gasCall(payload, url, token) {
        const u = url || SYNC.url,
          t = token !== undefined ? token : SYNC.token;
        const res = await fetch(u, {
          method: "POST",
          /* text/plain 이어야 preflight(OPTIONS)가 안 생겨서 Apps Script가 받아준다 */
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(Object.assign({}, payload, { token: t })),
          redirect: "follow",
        });
        const raw = await res.text();
        if (/^\s*<(!doctype|html)/i.test(raw))
          throw new Error(
            "배포 설정에서 '액세스 권한이 있는 사용자'를 '모든 사용자'로 바꿔주세요",
          );
        let j;
        try {
          j = JSON.parse(raw);
        } catch (e) {
          throw new Error(
            "응답을 읽지 못했어요. 배포 URL이 /exec 로 끝나는지 확인해 주세요",
          );
        }
        if (!j.ok) throw new Error(j.error || "알 수 없는 오류");
        return j;
      }

      function quoteSymbols(only) {
        const allow = only && new Set(only.map(normalizeQuoteSymbol));
        const out = new Set();
        S.assets.forEach((a) =>
          (a.holdings || []).forEach((h) => {
            const symbol = normalizeQuoteSymbol(h.symbol);
            if (symbol && (!allow || allow.has(symbol))) out.add(symbol);
          }),
        );
        return Array.from(out);
      }
      async function refreshQuotes(only, opts) {
        opts = opts || {};
        if (!SYNC.url)
          throw new Error("먼저 설정에서 구글 시트를 연결해 주세요.");
        if (SYNC.stale)
          throw new Error("Apps Script를 최신 코드(v3)로 다시 배포해 주세요.");
        const symbols = quoteSymbols(only);
        if (!symbols.length)
          throw new Error("시세코드가 있는 종목이 없어요.");
        const j = await gasCall({ action: "quotes", symbols });
        const found = new Map(
          (j.quotes || [])
            .filter((q) => q && q.ok && Number(q.price) > 0)
            .map((q) => [normalizeQuoteSymbol(q.symbol), q]),
        );
        let updated = 0;
        S.assets.forEach((a) =>
          (a.holdings || []).forEach((h) => {
            const q = found.get(normalizeQuoteSymbol(h.symbol));
            if (!q) return;
            h.price = Math.round(Number(q.price));
            h.marketPrice = Number(q.marketPrice) || 0;
            h.currency = q.currency || "";
            h.fxRate = Number(q.fxRate) || 0;
            h.quotedAt = q.quotedAt || new Date().toISOString();
            updated++;
          }),
        );
        if (updated) persist("assets");
        if (opts.render !== false) render();
        const failed = symbols.length - found.size;
        if (!opts.quiet)
          toast(
            updated
              ? `${updated}개 시세 갱신${failed ? ` · ${failed}개 실패` : ""}`
              : "시세를 받지 못했어요. 시세코드를 확인해 주세요.",
          );
        return { updated, failed };
      }

      function txRows() {
        const rows = [];
        Object.keys(S.months)
          .sort()
          .forEach((ym) => {
            (S.months[ym].items || []).forEach((it) =>
              rows.push({
                d: it.d,
                k: it.k,
                c: it.c,
                cn: catById(it.c).name,
                a: it.a,
                m: it.m || "",
                o: !!it.o,
                id: it.id,
              }),
            );
          });
        rows.sort(
          (a, b) =>
            a.d.localeCompare(b.d) || String(a.id).localeCompare(String(b.id)),
        );
        return rows;
      }
      function assetRows() {
        return S.assets.map((a) =>
          Object.assign({}, a, {
            principal: isInvestGroup(a.group)
              ? accountPrincipal(a)
              : Number(a.principal) || 0,
            gn: (GROUPS.find((g) => g.id === a.group) || {}).name || a.group,
          }),
        );
      }
      /* 종목은 시트에서 따로 관리한다 (시트에서 현재가만 고쳐도 반영되게) */
      function holdRows() {
        const out = [];
        S.assets.forEach((a) =>
          (a.holdings || []).forEach((h) =>
            out.push({
              acctId: a.id,
              acct: a.name,
              name: h.name,
              qty: Number(h.qty) || 0,
              avg: Number(h.avg) || 0,
              price: Number(h.price) || 0,
              symbol: normalizeQuoteSymbol(h.symbol),
              marketPrice: Number(h.marketPrice) || 0,
              currency: h.currency || "",
              fxRate: Number(h.fxRate) || 0,
              quotedAt: h.quotedAt || "",
            }),
          ),
        );
        return out;
      }
      function settingsPart() {
        return {
          cats: S.settings.cats,
          budgets: S.settings.budgets,
          recurring: S.settings.recurring,
          quick: S.settings.quick,
          rec: S.rec || {},
        };
      }
      function buildParts(keys) {
        const parts = {};
        if (keys.some((k) => k.startsWith("month:"))) parts.tx = txRows();
        if (keys.includes("settings") || keys.includes("rec"))
          parts.settings = settingsPart();
        if (keys.includes("assets")) {
          parts.assets = assetRows();
          parts.holds = holdRows();
        }
        if (keys.includes("snaps")) parts.snaps = S.snaps;
        return parts;
      }

      async function pushSheet(all) {
        if (!SYNC.url || SYNC.busy) return;
        const keys = all
          ? ["month:*", "settings", "assets", "snaps"]
          : Array.from(dirty);
        if (!keys.length) return;
        dirty.clear();
        SYNC.busy = true;
        setSync("busy");
        try {
          const j = await gasCall({
            action: "save",
            rev: S.rev || 1,
            parts: buildParts(keys),
          });
          S.rev = j.rev || S.rev;
          saveLocal();
          setSync("ok", Date.now());
        } catch (e) {
          keys.forEach((k) => dirty.add(k)); // 다음 저장 때 다시 시도
          setSync("err");
          console.warn("시트 저장 실패:", e.message);
        } finally {
          SYNC.busy = false;
        }
      }

      function adoptRemote(d, rev) {
        if (
          !d ||
          !d.settings ||
          !Array.isArray(d.settings.cats) ||
          !d.settings.cats.length
        )
          return false;
        S.settings = {
          cats: d.settings.cats,
          budgets: d.settings.budgets || {},
          recurring: d.settings.recurring || [],
          quick: d.settings.quick || SEED_SETTINGS.quick,
        };
        S.rec = d.settings.rec || {};
        S.months = d.months || {};
        S.assets = d.assets && d.assets.length ? d.assets : S.assets;
        S.snaps = d.snaps || {};
        S.rev = rev || 0;
        if (migrate()) persist("assets", "snaps");
        saveLocal();
        return true;
      }

      async function syncBoot() {
        if (!SYNC.url) return;
        setSync("busy");
        try {
          try {
            const pg = await gasCall({ action: "ping" });
            SYNC.ver = pg.version || 1;
            SYNC.sheetName = pg.name || "";
            SYNC.stale = SYNC.ver < NEED_SCRIPT_VERSION;
          } catch (e) {}
          const j = await gasCall({ action: "load" });
          const serverRev = j.rev || 0,
            localRev = S.rev || 0;
          if (serverRev > localRev && adoptRemote(j.data, serverRev)) {
            render();
          } else if (localRev > serverRev) {
            await pushSheet(true);
          }
          setSync(SYNC.stale ? "err" : "ok", Date.now());
        } catch (e) {
          setSync("err");
          console.warn("시트 연결 실패:", e.message);
        }
      }

      async function connectDB() {
        let db = null;
        try {
          db = await window.claude.use("db");
        } catch (e) {}
        if (!db) return;
        DB = db;
        try {
          const st = await db.doc("state/settings").get();
          if (st.exists) {
            S.settings = st.data();
            const [as, sn, rc, ms] = await Promise.all([
              db.doc("state/assets").get(),
              db.doc("state/snapshots").get(),
              db.doc("state/recurring").get(),
              db.collection("months").limit(400).get(),
            ]);
            if (as.exists) S.assets = as.data().list || [];
            if (sn.exists) S.snaps = sn.data().map || {};
            if (rc.exists) S.rec = rc.data().done || {};
            S.months = {};
            ms.docs.forEach((d) => {
              S.months[d.id] = d.data();
            });
            if (migrate()) persist("assets", "snaps");
            saveLocal();
          } else {
            dirty.add("settings");
            dirty.add("assets");
            dirty.add("snaps");
            dirty.add("rec");
            Object.keys(S.months).forEach((m) => dirty.add("month:" + m));
            await pushDB();
          }
        } catch (e) {}
        dbReady = true;
        render();
      }

      /* ============================== 파생 계산 ============================== */
      const catById = (id) =>
        S.settings.cats.find((c) => c.id === id) || {
          id,
          name: id,
          kind: "ex",
        };
      const catColor = (c) =>
        c.kind === "in"
          ? c.deduct
            ? "var(--invest)"
            : "var(--accent)"
          : "var(--expense)";
      const monthItems = (ym) => (S.months[ym] && S.months[ym].items) || [];

      function summarize(ym) {
        const items = monthItems(ym);
        let income = 0,
          gross = 0,
          deduct = 0,
          once = 0,
          fixedSpent = 0;
        const byCat = {};
        const fixedCats = new Set(S.settings.recurring.map((r) => r.cat));
        items.forEach((it) => {
          const c = catById(it.c);
          if (it.k === "in") {
            if (c.deduct) deduct += it.a;
            else income += it.a;
          } else {
            gross += it.a;
            byCat[it.c] = (byCat[it.c] || 0) + it.a;
            if (it.o) once += it.a;
            if (fixedCats.has(it.c)) fixedSpent += it.a;
          }
        });
        const net = gross - deduct;
        return {
          income,
          gross,
          deduct,
          net,
          once,
          fixedSpent,
          byCat,
          living: Math.max(0, net - once),
          left: income - net,
          count: items.length,
        };
      }
      function allMonths() {
        const set = new Set(Object.keys(S.months));
        set.add(UI.month);
        return Array.from(set).filter(Boolean).sort();
      }
      function forecast(ym) {
        const s = summarize(ym);
        const dim = daysIn(ym);
        const today = todayISO();
        const isCurrent = ymOf(today) === ym;
        if (!isCurrent) return null;
        const elapsed = Math.max(1, Number(today.slice(8, 10)));
        const variable = Math.max(0, s.net - s.once - s.fixedSpent);
        const fixedTotal = S.settings.recurring.reduce(
          (a, r) => a + r.amount,
          0,
        );
        const fixedRemain = Math.max(0, fixedTotal - s.fixedSpent);
        const projected =
          Math.round((variable / elapsed) * dim) +
          fixedRemain +
          s.fixedSpent +
          s.once;
        return { elapsed, dim, projected, variable, fixedRemain };
      }
      function missingRecurring(ym) {
        const items = monthItems(ym);
        return S.settings.recurring.filter(
          (r) =>
            !items.some(
              (it) =>
                it.c === r.cat &&
                it.k === "ex" &&
                (it.m || "").includes(r.name),
            ),
        );
      }
      const holdVal = (h) => (Number(h.qty) || 0) * (Number(h.price) || 0);
      const holdCost = (h) => (Number(h.qty) || 0) * (Number(h.avg) || 0);
      /* 투자 계좌의 누적 원금은 각 종목의 평단가 × 보유 수량 합계다. */
      const accountPrincipal = (a) =>
        (a.holdings || []).reduce((sum, h) => sum + holdCost(h), 0);
      function assetValue(a) {
        /* 종목이 등록돼 있으면 종목 평가액 합이 우선, 없으면 직접 입력한 평가액 */
        if (a.holdings && a.holdings.length) {
          const v = a.holdings.reduce(
            (s, h) => s + (Number(h.qty) || 0) * (Number(h.price) || 0),
            0,
          );
          if (v > 0) return v;
        }
        if (a.group === "real")
          return (Number(a.value) || 0) - (Number(a.loan) || 0);
        if (a.group === "debt") return -Math.abs(Number(a.value) || 0);
        return Number(a.value) || 0;
      }
      function assetTotals() {
        const g = {};
        GROUPS.forEach((x) => (g[x.id] = 0));
        S.assets.forEach((a) => {
          g[a.group] = (g[a.group] || 0) + assetValue(a);
        });
        const total = Object.values(g).reduce((a, b) => a + b, 0);
        const investTotal = GROUPS.filter((x) => x.invest).reduce(
          (s, x) => s + (g[x.id] || 0),
          0,
        );
        const totalExReal = total - (g.real || 0);
        return { g, total, investTotal, totalExReal };
      }
      /* 투자 계좌들의 원금·납입 집계 */
      function investTotals() {
        const { g, investTotal, total, totalExReal } = assetTotals();
        let principal = 0,
          contrib = 0;
        S.assets.forEach((a) => {
          if (!isInvestGroup(a.group)) return;
          principal += accountPrincipal(a);
          contrib += Number(a.monthly) || 0;
        });
        const pl = principal ? investTotal - principal : 0;
        return {
          g,
          investTotal,
          principal,
          contrib,
          pl,
          rate: principal ? pl / principal : 0,
          total,
          totalExReal,
        };
      }

      /* 모든 계좌의 종목을 하나로 모아 비중 계산 */
      function allHoldings() {
        const out = [];
        S.assets.forEach((a) => {
          (a.holdings || []).forEach((h, i) => {
            const qty = Number(h.qty) || 0,
              price = Number(h.price) || 0,
              avg = Number(h.avg) || 0;
            const v = qty * price,
              cost = qty * avg;
            if (!v && !cost) return;
            out.push({
              name: h.name,
              acct: a.name,
              group: a.group,
              qty,
              price,
              avg,
              symbol: normalizeQuoteSymbol(h.symbol),
              marketPrice: Number(h.marketPrice) || 0,
              currency: h.currency || "",
              fxRate: Number(h.fxRate) || 0,
              quotedAt: h.quotedAt || "",
              v,
              cost,
              pl: v - cost,
              aid: a.id,
              hi: i,
            });
          });
        });
        return out.sort((x, y) => y.v - x.v);
      }
      function holdingPriceText(h) {
        if (
          h.currency === "USD" &&
          Number(h.marketPrice) > 0 &&
          Number(h.fxRate) > 0
        ) {
          return `$${Number(h.marketPrice).toLocaleString("ko-KR", { maximumFractionDigits: 4 })} × ${Number(h.fxRate).toLocaleString("ko-KR", { maximumFractionDigits: 2 })}원 = ${won(h.price)}원`;
        }
        return `${won(h.price)}원`;
      }
      /* 스냅샷: 사용자가 말한 컬럼 순서를 그대로 담는다 */
      function buildSnapshot() {
        const t = investTotals();
        const snap = {
          at: todayISO(),
          contrib: t.contrib,
          principal: t.principal,
          invest: t.investTotal,
          total: t.total,
          totalExReal: t.totalExReal,
        };
        GROUPS.forEach((x) => (snap[x.id] = t.g[x.id] || 0));
        return snap;
      }

      /* ============================== 화면: 기록 ============================== */
      function viewRecord() {
        const s = summarize(UI.month);
        const cats = S.settings.cats.filter((c) =>
          UI.kind === "in" ? c.kind === "in" : c.kind === "ex",
        );
        if (!cats.some((c) => c.id === UI.cat)) UI.cat = cats[0].id;
        const recent = monthItems(UI.month)
          .slice()
          .sort((a, b) => (b.d + b.id).localeCompare(a.d + a.id))
          .slice(0, 4);
        const miss = missingRecurring(UI.month);
        const c = catById(UI.cat);

        return `
  <section>
   <div class="cols cols-rec">
    <div class="colA">
    <div class="amount-stage">
      <div class="kindtoggle" role="group" aria-label="수입/지출">
        <button data-kind="ex" aria-pressed="${UI.kind === "ex"}">지출</button>
        <button data-kind="in" aria-pressed="${UI.kind === "in"}">수입</button>
      </div>
      <label class="bigamt" for="amt">
        <input id="amt" class="amtinput" type="text" inputmode="numeric" autocomplete="off"
               enterkeyhint="done" placeholder="0" aria-label="금액"
               value="${UI.amount ? won(UI.amount) : ""}"
               style="color:${UI.amount ? (UI.kind === "in" ? "var(--accent)" : "var(--ink)") : "var(--ink3)"}">
        <span class="w">원</span>
      </label>
      <div class="datepick">
        <input type="date" id="dpick" value="${UI.date}" max="2099-12-31">
        <span>·</span><span>${c.name}</span>
      </div>
    </div>

    ${
      miss.length
        ? `<div class="banner" style="margin:6px 0 14px">
      <div><div class="t">이번 달 고정비 ${miss.length}건이 아직 없어요</div>
      <div class="s">${miss.map((r) => r.name).join(" · ")} · 합계 ${won(miss.reduce((a, r) => a + r.amount, 0))}원</div></div>
      <button id="addAllRec">한번에 넣기</button></div>`
        : ""
    }

    <div class="quicks">
      ${S.settings.quick.map((q, i) => `<button class="quick" data-quick="${i}">${esc(q.label)} <b>${won(q.amount)}</b></button>`).join("")}
      <button class="quick" data-quick="edit" style="color:var(--ink3)">＋ 편집</button>
    </div>

    <h2 class="sec">분류</h2>
    <div class="catgrid">
      ${cats
        .map(
          (
            c,
          ) => `<button class="cat" data-cat="${c.id}" aria-pressed="${UI.cat === c.id}" style="color:${UI.cat === c.id ? catColor(c) : "inherit"}">
        <span class="dot" style="background:${catColor(c)}"></span>${esc(c.name)}</button>`,
        )
        .join("")}
    </div>

    <div class="kbdhint">
      <span><kbd>Enter</kbd> 기록</span>
      <span><kbd>M</kbd> 메모</span>
      <span><kbd>T</kbd> 지출·수입</span>
      <span><kbd>[</kbd><kbd>]</kbd> 달 이동</span>
    </div>

    <div class="stack" style="margin-top:14px">
      <input class="memoinput" id="memo" placeholder="메모 (선택) — 예: 지하철, 편의점 우유" value="${esc(UI.memo)}">
      ${
        UI.kind === "ex"
          ? `<button class="switchline" id="onceBtn">
        <span><span style="font-weight:500">일회성 지출로 분리</span><br><span class="hint">경조사·의료처럼 매달 안 나가는 돈. 평소 생활비에서 빠져요</span></span>
        <span class="sw" aria-pressed="${UI.once}"></span></button>`
          : ""
      }
      <button class="btn" id="saveTx" ${UI.amount ? "" : "disabled"}>${UI.amount ? won(UI.amount) + "원 기록" : "금액을 입력하세요"}</button>
    </div>

    </div>
    <div class="colB">
    <h2 class="sec">${ymLabel(UI.month)} 현황</h2>
    <div class="tiles">
      <div class="tile"><div class="k">수입</div><div class="v" style="color:var(--accent)">${won(s.income)}</div></div>
      <div class="tile"><div class="k">지출</div><div class="v" style="color:var(--expense)">${won(s.net)}</div><div class="d">${s.deduct ? `적립 ${won(s.deduct)} 차감` : "&nbsp;"}</div></div>
      <div class="tile"><div class="k">남은 돈</div><div class="v">${won(s.left)}</div></div>
    </div>

    ${
      recent.length
        ? `<h2 class="sec">최근 기록</h2>
    <div class="card rows">${recent.map(rowHTML).join("")}</div>`
        : ""
    }
    </div>
   </div>
  </section>`;
      }
      /* 금액 — 입력칸 하나가 원본. 모바일은 탭하면 OS 숫자키패드가 뜬다. */
      function setAmount(n) {
        UI.amount = Math.max(
          0,
          Math.min(9999999999, Math.floor(Number(n) || 0)),
        );
        syncAmountUI();
      }
      function syncAmountUI() {
        const el = $("#amt");
        if (el) {
          const s = UI.amount ? won(UI.amount) : "";
          if (el.value !== s) el.value = s;
          el.style.color = UI.amount
            ? UI.kind === "in"
              ? "var(--accent)"
              : "var(--ink)"
            : "var(--ink3)";
        }
        const sb = $("#saveTx");
        if (sb) {
          sb.disabled = !UI.amount;
          sb.textContent = UI.amount
            ? won(UI.amount) + "원 기록"
            : "금액을 입력하세요";
        }
      }

      function rowHTML(it) {
        const c = catById(it.c);
        return `<button class="row" data-item="${it.id}" data-ym="${ymOf(it.d)}">
    <span class="dot" style="background:${catColor(c)}"></span>
    <span class="grow"><span class="nm">${esc(c.name)}</span>${it.m ? ` <span class="mm">${esc(it.m)}</span>` : ""}</span>
    ${it.o ? `<span class="tag once">일회성</span>` : ""}
    <span class="amt num" style="color:${it.k === "in" ? "var(--accent)" : "var(--ink)"}">${it.k === "in" ? "+" : ""}${won(it.a)}</span>
  </button>`;
      }

      /* ============================== 화면: 내역 ============================== */
      function viewList() {
        const items = monthItems(UI.month)
          .slice()
          .filter(
            (it) =>
              UI.filter === "all" ||
              (UI.filter === "once" ? it.o : it.k === UI.filter),
          )
          .sort((a, b) => b.d.localeCompare(a.d) || b.id.localeCompare(a.id));
        const s = summarize(UI.month);
        const groups = {};
        items.forEach((it) => {
          (groups[it.d] = groups[it.d] || []).push(it);
        });
        const days = Object.keys(groups).sort().reverse();
        const miss = missingRecurring(UI.month);

        return `<section>
   <div class="cols cols-list">
    <div class="colB">
    <div class="tiles">
      <div class="tile"><div class="k">수입</div><div class="v" style="color:var(--accent)">${won(s.income)}</div></div>
      <div class="tile"><div class="k">지출</div><div class="v" style="color:var(--expense)">${won(s.net)}</div></div>
      <div class="tile"><div class="k">건수</div><div class="v">${s.count}</div></div>
    </div>
    ${
      miss.length
        ? `<div class="banner" style="margin-top:14px">
      <div><div class="t">고정비 ${miss.length}건 미입력</div><div class="s">${miss.map((r) => r.name).join(" · ")}</div></div>
      <button id="addAllRec">한번에 넣기</button></div>`
        : ""
    }
    </div>
    <div class="colA">
    <div class="hstack" style="margin:16px 0 10px">
      ${[
        ["all", "전체"],
        ["ex", "지출"],
        ["in", "수입"],
        ["once", "일회성"],
      ]
        .map(
          ([k, n]) =>
            `<button class="quick" data-filter="${k}" style="${UI.filter === k ? "border-color:var(--accent);color:var(--accent);font-weight:600" : ""}">${n}</button>`,
        )
        .join("")}
      <button class="quick" id="exportMonth" style="margin-left:auto;color:var(--ink2)">이 달 CSV</button>
    </div>
    <div class="card rows">
      ${
        days.length
          ? days
              .map((d) => {
                const dd = new Date(d + "T00:00:00");
                return (
                  `<div class="daymark">${Number(d.slice(8, 10))}일 ${dowKo[dd.getDay()]}요일<span style="float:right;font-weight:500;font-family:'IBM Plex Mono',monospace">${won(groups[d].filter((i) => i.k === "ex").reduce((a, i) => a + i.a, 0))}</span></div>` +
                  groups[d].map(rowHTML).join("")
                );
              })
              .join("")
          : `<div class="empty">${ymLabel(UI.month)}에 기록이 없어요.<br>기록 탭에서 첫 줄을 남겨보세요.</div>`
      }
    </div>
    </div>
   </div>
  </section>`;
      }

      /* ============================== 화면: 통계 ============================== */
      function viewStats() {
        const ym = UI.month,
          s = summarize(ym),
          prev = summarize(shiftYM(ym, -1));
        const f = forecast(ym);
        const months = allMonths().slice(-6);
        const nowYm = ymOf(todayISO()),
          liveInvest = assetTotals().investTotal || 0;
        let carry = 0;
        const series = months.map((m) => {
          const x = summarize(m);
          let inv = S.snaps[m] && S.snaps[m].invest;
          if (inv == null && m === nowYm) inv = liveInvest;
          if (inv == null) inv = carry;
          carry = inv;
          return { m, income: x.income, expense: x.net, invest: inv };
        });

        const budgets = Object.entries(S.settings.budgets)
          .filter(([, v]) => v > 0)
          .map(([cid, limit]) => ({ cid, limit, used: s.byCat[cid] || 0 }))
          .sort((a, b) => b.used / b.limit - a.used / a.limit);

        const ranks = Object.entries(s.byCat)
          .sort((a, b) => b[1] - a[1])
          .slice(0, 10);
        const maxRank = ranks.length ? ranks[0][1] : 1;

        return `<section>
    <div class="tiles">
      <div class="tile"><div class="k">수입</div><div class="v" style="color:var(--accent)">${won(s.income)}</div></div>
      <div class="tile"><div class="k">지출</div><div class="v" style="color:var(--expense)">${won(s.net)}</div>
        <div class="d">${prev.net ? `<span class="${s.net > prev.net ? "up" : "down"}">${s.net > prev.net ? "▲" : "▼"}${shortWon(Math.abs(s.net - prev.net))}</span> 지난달` : "&nbsp;"}</div></div>
      <div class="tile"><div class="k">저축 여력</div><div class="v">${won(s.left)}</div>
        <div class="d">${s.income ? Math.round((s.left / s.income) * 100) + "% 남김" : "&nbsp;"}</div></div>
    </div>

    ${
      f
        ? `<div class="lede" style="margin-top:14px">
      ${Number(todayISO().slice(8, 10))}일까지 <b>${won(s.net)}</b>원 썼어요. 이 페이스면 이번 달은 약 <b>${won(f.projected)}</b>원,
      남은 고정비 <b>${won(f.fixedRemain)}</b>원을 포함한 값이에요.
    </div>`
        : ""
    }

    <h2 class="sec">평소 생활비 vs 일회성</h2>
    <div class="card pad">
      ${
        s.net > 0
          ? `<div class="splitbar">
        <div style="flex:${s.living};background:var(--expense)">${s.living / s.net > 0.18 ? won(s.living) : ""}</div>
        ${s.once > 0 ? `<div style="flex:${s.once};background:var(--warn)">${s.once / s.net > 0.18 ? won(s.once) : ""}</div>` : ""}
      </div>
      <div class="legend"><span><i style="background:var(--expense)"></i>평소 생활비 ${won(s.living)}원</span>
      <span><i style="background:var(--warn)"></i>일회성 ${won(s.once)}원</span></div>
      <div class="note" style="margin-top:10px">일회성을 빼면 이번 달 생활비는 <b class="num">${won(s.living)}</b>원. 달마다 비교할 땐 이 숫자가 진짜예요.</div>`
          : `<div class="empty" style="padding:12px">아직 지출 기록이 없어요.</div>`
      }
    </div>

    <div class="cols cols-half"><div class="colA">
    ${
      budgets.length
        ? `<h2 class="sec">예산</h2>
    <div class="card">${budgets
      .map((b) => {
        const c = catById(b.cid),
          r = b.limit ? b.used / b.limit : 0;
        const pace =
          ym === ymOf(todayISO())
            ? Math.min(1, Number(todayISO().slice(8, 10)) / daysIn(ym))
            : 1;
        const st = r > 1 ? "crit" : r > pace * 0.9 ? "warn" : "good";
        const stName = r > 1 ? "초과" : r > pace * 0.9 ? "빠름" : "여유";
        return `<div class="bud"><div class="top"><span class="n">${esc(c.name)}</span>
        <span class="pill ${st}">${stName}</span>
        <span class="r">${won(b.used)} / ${won(b.limit)}</span></div>
        <div class="track"><i style="width:${Math.min(100, r * 100).toFixed(1)}%;background:var(--${st === "crit" ? "crit" : st === "warn" ? "warn" : "good"})"></i></div></div>`;
      })
      .join("")}</div>
    <div class="note" style="margin-top:8px">예산은 설정 탭에서 바꿀 수 있어요.</div>`
        : ""
    }
    </div><div class="colB">
    <h2 class="sec">카테고리 지출</h2>
    <div class="card">${
      ranks.length
        ? ranks
            .map(([cid, v]) => {
              const c = catById(cid),
                p = prev.byCat[cid] || 0;
              return `<div class="rank">
        <div class="n">${esc(c.name)}</div><div class="v">${won(v)}</div>
        <div class="bar"><i style="width:${((v / maxRank) * 100).toFixed(1)}%"></i></div>
        <div class="delta ${v > p ? "up" : v < p ? "down" : ""}">${p ? (v > p ? "▲" : "▼") + won(Math.abs(v - p)) : "신규"}</div>
      </div>`;
            })
            .join("")
        : `<div class="empty">지출 기록이 없어요.</div>`
    }</div>
    <div class="note" style="margin-top:8px">오른쪽 숫자는 ${ymLabel(shiftYM(ym, -1))} 대비 증감이에요.</div>
    </div></div>

    <h2 class="sec">월별 흐름</h2>
    <div class="card pad">
      <div class="chartwrap">${barChart(series)}</div>
      <div class="legend">
        <span><i style="background:var(--accent)"></i>수입</span>
        <span><i style="background:var(--expense)"></i>지출</span>
        <span><i style="background:var(--invest)"></i>투자 평가액</span>
      </div>
    </div>
  </section>`;
      }
      function deltaText(a, b) {
        const d = a - b;
        if (!b) return "&nbsp;";
        return (d > 0 ? "▲ " : "▼ ") + won(Math.abs(d)) + " vs 지난달";
      }

      /* 화면 폭에 맞춘 차트 너비. frac=1 전체폭, 0.5 반폭 */
      function cw(frac) {
        const wide = window.innerWidth >= 1080;
        const avail = wide
          ? Math.min(window.innerWidth - 300, 1040)
          : window.innerWidth - 62;
        return Math.max(300, Math.round(avail * (wide ? frac || 1 : 1)) - 30);
      }
      function barChart(series) {
        if (!series.length) return `<div class="empty">데이터가 없어요.</div>`;
        const W = Math.max(cw(1), series.length * 84 + 56),
          H = 190,
          PL = 52,
          PR = 10,
          PT = 12,
          PB = 30;
        const max = Math.max(
          1,
          ...series.flatMap((d) => [d.income, d.expense, d.invest]),
        );
        const step = niceStep(max),
          top = Math.ceil(max / step) * step;
        const iw = (W - PL - PR) / series.length,
          bw = Math.min(15, (iw - 14) / 3);
        const y = (v) => PT + (H - PT - PB) * (1 - v / top);
        const keys = [
          ["income", "var(--accent)", "수입"],
          ["expense", "var(--expense)", "지출"],
          ["invest", "var(--invest)", "투자"],
        ];
        let g = "";
        for (let v = 0; v <= top + 1; v += step) {
          g += `<line class="grid" x1="${PL}" x2="${W - PR}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"></line>
          <text x="${PL - 7}" y="${(y(v) + 3.5).toFixed(1)}" text-anchor="end">${v === 0 ? "0" : shortWon(v)}</text>`;
        }
        let bars = "";
        series.forEach((d, i) => {
          const cx = PL + iw * i + iw / 2;
          keys.forEach((k, j) => {
            const v = d[k[0]],
              h = Math.max(v > 0 ? 2 : 0, ((H - PT - PB) * v) / top);
            const x = cx - (bw * 3 + 4) / 2 + j * (bw + 2);
            if (h > 0)
              bars += `<rect x="${x.toFixed(1)}" y="${(H - PB - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${k[1]}"></rect>`;
          });
          bars += `<rect class="hit" x="${(PL + iw * i).toFixed(1)}" y="${PT}" width="${iw.toFixed(1)}" height="${H - PT - PB}" fill="transparent"
      data-tip="${esc(
        JSON.stringify({
          t: ymLabel(d.m),
          rows: [
            ["수입", d.income, "var(--accent)"],
            ["지출", d.expense, "var(--expense)"],
            ["투자", d.invest, "var(--invest)"],
          ],
        }),
      )}"></rect>`;
          bars += `<text class="lbl" x="${cx.toFixed(1)}" y="${H - PB + 16}" text-anchor="middle">${d.m.slice(5)}월</text>`;
        });
        return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="월별 수입 지출 투자 막대 그래프">
    <line class="axis" x1="${PL}" x2="${W - PR}" y1="${H - PB}" y2="${H - PB}"></line>${g}${bars}</svg>`;
      }
      function niceStep(max) {
        const raw = max / 4,
          mag = Math.pow(10, Math.floor(Math.log10(raw)));
        const n = raw / mag;
        return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * mag;
      }
      function shortWon(v) {
        if (v >= 100000000)
          return (v / 100000000).toFixed(v % 100000000 ? 1 : 0) + "억";
        if (v >= 10000)
          return (v / 10000).toFixed(v % 10000 && v < 1000000 ? 1 : 0) + "만";
        return won(v);
      }

      /* ============================== 화면: 자산 ============================== */
      /* 자산 탭 — 안에서 '자산'과 '투자'를 전환한다 */
      function viewWealth() {
        const seg = `<div class="seg" role="group" aria-label="자산 화면">
      <button data-wealth="assets" aria-pressed="${UI.wealth === "assets"}">자산</button>
      <button data-wealth="invest" aria-pressed="${UI.wealth === "invest"}">투자</button>
    </div>`;
        const body = UI.wealth === "invest" ? viewInvest() : viewAssets();
        return body.replace("<section>", "<section>\n    " + seg);
      }

      function viewAssets() {
        const t = investTotals();
        const g = t.g,
          total = t.total;
        const snapKeys = Object.keys(S.snaps).sort();
        const pts = snapKeys.map((k) => ({ m: k, v: S.snaps[k].total || 0 }));
        const nowYm = ymOf(todayISO());
        if (!pts.length || pts[pts.length - 1].m !== nowYm)
          pts.push({ m: nowYm, v: total, live: true });
        const prev = pts.length > 1 ? pts[pts.length - 2].v : null;

        const byGroup = GROUPS.map((gr) => ({
          ...gr,
          v: g[gr.id] || 0,
          items: S.assets.filter((a) => a.group === gr.id),
        })).filter((gr) => gr.items.length);
        const posTotal =
          GROUPS.reduce((a, gr) => a + Math.max(0, g[gr.id] || 0), 0) || 1;

        return `<section>
    <div class="hero">
      <div class="k">순자산</div>
      <div class="v">${won(total)}<span style="font-family:'IBM Plex Sans KR';font-size:18px;font-weight:500;color:var(--ink2)"> 원</span></div>
      <div class="d">${
        prev == null
          ? "첫 스냅샷"
          : total === prev
            ? ymLabel(pts[pts.length - 2].m) + "과 같음"
            : (total > prev ? "▲ " : "▼ ") +
              won(Math.abs(total - prev)) +
              "원 vs " +
              ymLabel(pts[pts.length - 2].m)
      }
        · 부동산 제외 ${won(t.totalExReal)}</div>
      <div style="margin-top:14px" class="splitbar">
        ${GROUPS.filter((gr) => (g[gr.id] || 0) > 0)
          .map(
            (gr) =>
              `<div style="flex:${g[gr.id]};background:${GSHADE[gr.id]}" title="${gr.name} ${won(g[gr.id])}">${g[gr.id] / posTotal > 0.15 ? gr.name : ""}</div>`,
          )
          .join("")}
      </div>
    </div>

    <div class="tiles" style="margin-top:14px">
      <div class="tile"><div class="k">현금·예금</div><div class="v">${won(g.cash || 0)}</div></div>
      <div class="tile"><div class="k">투자 평가액</div><div class="v" style="color:var(--invest)">${won(t.investTotal)}</div>
        <div class="d">${t.principal ? (t.pl >= 0 ? "+" : "") + shortWon(t.pl) + " (" + (t.rate * 100).toFixed(1) + "%)" : "평단가 미입력"}</div></div>
      <div class="tile"><div class="k">청약·부동산 등</div><div class="v">${won((g.housing || 0) + (g.real || 0) + (g.insure || 0) + (g.debt || 0))}</div>
        <div class="d">${g.housing ? "청약 " + shortWon(g.housing) : "&nbsp;"}</div></div>
    </div>

    ${
      pts.length > 1
        ? `<h2 class="sec">순자산 추이</h2>
    <div class="card pad"><div class="chartwrap">${lineChart(pts)}</div>
    <div class="note" style="margin-top:8px">달마다 스냅샷을 저장하면 점이 늘어나요.</div></div>`
        : ""
    }

    <div class="hstack" style="margin-top:16px">
      <button class="btn sm" id="snapNow">${ymLabel(nowYm)} 스냅샷 저장</button>
      <button class="btn sm ghost" id="addAsset">＋ 계좌·자산 추가</button>
      ${SYNC.url ? `<button class="btn sm ghost" id="quoteRefresh">↻ 시세 새로고침</button>` : ""}
    </div>

    <div class="assetgrid" style="margin-top:14px">
    ${byGroup
      .map(
        (gr) => `
      <div class="card">
        <div class="grouphead">${gr.name}<span class="gv">${won(gr.v)}</span></div>
        <div class="rows">${gr.items
          .map((a) => {
            const v = assetValue(a);
            const hs = a.holdings || [];
            const cost = isInvestGroup(a.group)
              ? accountPrincipal(a)
              : Number(a.principal) || 0;
            const pl = cost ? v - cost : 0;
            return (
              `<button class="row" data-asset="${a.id}">
              <span class="dot" style="background:${GSHADE[gr.id]}"></span>
              <span class="grow"><span class="nm">${esc(a.name)}</span>
                ${a.note && !v ? `<span class="mm needs"> ${esc(a.note)}</span>` : ""}
                ${a.group === "real" && a.loan ? `<span class="mm"> 시세 ${shortWon(a.value)} − 대출 ${shortWon(a.loan)}</span>` : ""}
                ${cost && v ? `<span class="mm" style="color:${pl >= 0 ? "var(--crit)" : "var(--invest)"}"> ${pl >= 0 ? "+" : ""}${won(pl)} (${((pl / cost) * 100).toFixed(1)}%)</span>` : ""}
              </span>
              <span class="amt num">${won(v)}</span>
            </button>` +
              hs
                .map(
                  (
                    h,
                    i,
                  ) => `<button class="hold" data-asset="${a.id}" data-hold="${i}">
                 <span class="grow"><span>${esc(h.name)}</span><span class="mm">${h.qty}주 · ${holdingPriceText(h)}</span></span>
                 <span class="amt">${won(holdVal(h))}</span></button>`,
                )
                .join("")
            );
          })
          .join("")}</div>
      </div>`,
      )
      .join("")}
    </div>

    <div class="note" style="margin:14px 0 30px">${
      SYNC.url
        ? `시세코드를 등록한 종목은 <b>시세 새로고침</b>으로 현재가를 갱신해요. 미국 종목은 달러 시세에 원/달러 환율을 적용합니다.`
        : `자동 시세를 쓰려면 먼저 <b>설정 → 구글 시트 연결</b>을 해주세요. 연결 전에는 종목 줄에서 현재가를 직접 고칠 수 있어요.`
    }</div>
  </section>`;
      }

      /* ══════════ 투자 탭 ══════════ */
      function viewInvest() {
        const t = investTotals();
        const nowYm = ymOf(todayISO());
        const holds = allHoldings();
        const holdTotal = holds.reduce((s, h) => s + h.v, 0);

        /* 월별 표 — 스냅샷 + 이번 달 현재값 */
        const rows = Object.keys(S.snaps)
          .sort()
          .map((m) => ({ m, ...S.snaps[m] }));
        if (!rows.length || rows[rows.length - 1].m !== nowYm)
          rows.push({ m: nowYm, live: true, ...buildSnapshot() });
        rows.forEach((r, i) => {
          r.delta = i
            ? (r.totalExReal || 0) - (rows[i - 1].totalExReal || 0)
            : null;
        });

        const investGroups = GROUPS.filter((x) => x.invest)
          .map((x) => ({ ...x, v: t.g[x.id] || 0 }))
          .filter((x) => x.v > 0);
        const invSum = investGroups.reduce((s, x) => s + x.v, 0) || 1;

        const chartPts = rows.map((r) => ({
          m: r.m,
          v: r.invest || 0,
          p: r.principal || 0,
        }));
        const hasPrincipal = chartPts.some((p) => p.p > 0);

        return `<section>
    <div class="tiles">
      <div class="tile"><div class="k">투자 평가액</div><div class="v" style="color:var(--invest)">${won(t.investTotal)}</div></div>
      <div class="tile"><div class="k">누적 납입원금</div><div class="v">${t.principal ? won(t.principal) : "—"}</div>
        <div class="d">${t.principal ? "평단가 × 보유 수량 자동 합산" : "종목의 평단가를 입력하세요"}</div></div>
      <div class="tile"><div class="k">평가손익</div>
        <div class="v" style="color:${t.principal ? (t.pl >= 0 ? "var(--crit)" : "var(--invest)") : "var(--ink3)"}">${t.principal ? (t.pl >= 0 ? "+" : "") + won(t.pl) : "—"}</div>
        <div class="d">${t.principal ? (t.rate * 100).toFixed(1) + "%" : "원금 입력 필요"}</div></div>
    </div>

    <div class="cols cols-half" style="margin-top:6px">
      <div class="colA">
        <h2 class="sec">계좌별 비중</h2>
        <div class="card pad">

      function investChart(pts, hasP) {
        const W = Math.max(cw(0.5), pts.length * 76 + 70),
          H = 190,
          PL = 58,
          PR = 36,
          PT = 14,
          PB = 30;
        const max = Math.max(
          1,
          ...pts.map((p) => Math.max(p.v, hasP ? p.p : 0)),
        );
        const step = niceStep(max),
          top = Math.ceil(max / step) * step;
        const x = (i) =>
          PL + (W - PL - PR) * (pts.length === 1 ? 0.5 : i / (pts.length - 1));
        const y = (v) => PT + (H - PT - PB) * (1 - v / top);
        let g = "";
        for (let v = 0; v <= top + 1; v += step)
          g += `<line class="grid" x1="${PL}" x2="${W - PR}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"></line>
          <text x="${PL - 7}" y="${(y(v) + 3.5).toFixed(1)}" text-anchor="end">${v === 0 ? "0" : shortWon(v)}</text>`;
        const dv = pts
          .map(
            (p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)} ${y(p.v).toFixed(1)}`,
          )
          .join(" ");
        const area =
          dv +
          ` L${x(pts.length - 1).toFixed(1)} ${y(0).toFixed(1)} L${x(0).toFixed(1)} ${y(0).toFixed(1)} Z`;
        const dp = hasP
          ? pts
              .map(
                (p, i) =>
                  `${i ? "L" : "M"}${x(i).toFixed(1)} ${y(p.p).toFixed(1)}`,
              )
              .join(" ")
          : "";
        const marks = pts
          .map((p, i) => {
            const last = i === pts.length - 1;
            return `<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="${last ? 5 : 3.5}" fill="${last ? "var(--invest)" : "var(--surface)"}" stroke="var(--invest)" stroke-width="2"></circle>
    <rect class="hit" x="${(x(i) - 26).toFixed(1)}" y="${PT}" width="52" height="${H - PT - PB}" fill="transparent"
      data-tip="${esc(
        JSON.stringify({
          t: ymLabel(p.m),
          rows: hasP
            ? [
                ["평가액", p.v, "var(--invest)"],
                ["납입원금", p.p, "var(--ink3)"],
                [
                  "평가손익",
                  p.v - p.p,
                  p.v >= p.p ? "var(--crit)" : "var(--good)",
                ],
              ]
            : [["평가액", p.v, "var(--invest)"]],
        }),
      )}"></rect>
    <text class="lbl" x="${x(i).toFixed(1)}" y="${H - PB + 16}" text-anchor="middle">${p.m.slice(5)}월</text>`;
          })
          .join("");
        return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="투자 평가액과 납입원금 추이">
    <defs><linearGradient id="ig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--invest)" stop-opacity=".22"></stop>
      <stop offset="100%" stop-color="var(--invest)" stop-opacity="0"></stop></linearGradient></defs>
    ${g}<path d="${area}" fill="url(#ig)"></path>
    ${hasP ? `<path d="${dp}" fill="none" stroke="var(--ink3)" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"></path>` : ""}
    <path d="${dv}" fill="none" stroke="var(--invest)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path>
    ${marks}</svg>`;
      }

      function lineChart(pts) {
        const W = Math.max(cw(1), pts.length * 70 + 60),
          H = 170,
          PL = 54,
          PR = 26,
          PT = 14,
          PB = 28;
        const vals = pts.map((p) => p.v);
        const max = Math.max(1, ...vals),
          min = Math.min(0, ...vals);
        const step = niceStep(max - min || max),
          top = Math.ceil(max / step) * step,
          bot = Math.floor(min / step) * step;
        const x = (i) =>
          PL + (W - PL - PR) * (pts.length === 1 ? 0.5 : i / (pts.length - 1));
        const y = (v) =>
          PT + (H - PT - PB) * (1 - (v - bot) / (top - bot || 1));
        let g = "";
        for (let v = bot; v <= top + 1; v += step)
          g += `<line class="grid" x1="${PL}" x2="${W - PR}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"></line>
          <text x="${PL - 7}" y="${(y(v) + 3.5).toFixed(1)}" text-anchor="end">${v === 0 ? "0" : shortWon(v)}</text>`;
        const d = pts
          .map(
            (p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)} ${y(p.v).toFixed(1)}`,
          )
          .join(" ");
        const area =
          d +
          ` L${x(pts.length - 1).toFixed(1)} ${y(bot).toFixed(1)} L${x(0).toFixed(1)} ${y(bot).toFixed(1)} Z`;
        const dots = pts
          .map((p, i) => {
            const last = i === pts.length - 1;
            return `<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="${last ? 5 : 3.5}" fill="${last ? "var(--accent)" : "var(--surface)"}" stroke="var(--accent)" stroke-width="2"></circle>
    <rect class="hit" x="${(x(i) - 24).toFixed(1)}" y="${PT}" width="48" height="${H - PT - PB}" fill="transparent"
      data-tip="${esc(JSON.stringify({ t: ymLabel(p.m) + (p.live ? " (현재)" : ""), rows: [["순자산", p.v, "var(--accent)"]] }))}"></rect>
    <text class="lbl" x="${x(i).toFixed(1)}" y="${H - PB + 15}" text-anchor="middle">${p.m.slice(5)}월</text>`;
          })
          .join("");
        const lastP = pts[pts.length - 1];
        return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="순자산 추이 선 그래프">
    <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--accent)" stop-opacity=".22"></stop>
      <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"></stop></linearGradient></defs>
    ${g}<path d="${area}" fill="url(#ag)"></path>
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path>
    ${dots}
    <text x="${x(pts.length - 1).toFixed(1)}" y="${(y(lastP.v) < PT + 24 ? y(lastP.v) + 18 : y(lastP.v) - 11).toFixed(1)}" text-anchor="end" style="fill:var(--ink);font-weight:500">${shortWon(lastP.v)}</text>
  </svg>`;
      }

      /* ============================== 렌더 ============================== */
      function render() {
        $("#mlabel").textContent = ymLabel(UI.month);
        $$(".tabs button").forEach((b) =>
          b.setAttribute(
            "aria-current",
            b.dataset.tab === UI.tab ? "page" : "false",
          ),
        );
        const v =
          {
            record: viewRecord,
            list: viewList,
            stats: viewStats,
            wealth: viewWealth,
            settings: viewSettings,
          }[UI.tab] || viewRecord;
        $("#main").innerHTML = v();
        window.scrollTo({ top: 0 });
        /* 넓은 화면에서만 자동 포커스 — 모바일에서 키패드가 멋대로 올라오지 않도록 */
        if (UI.tab === "record" && window.innerWidth >= 1080) {
          const a = $("#amt");
          if (a) a.focus();
        }
      }

      /* ============================== 시트 ============================== */
      let sheetOpen = false;
      function openSheet(html, after) {
        $("#sheetIn").innerHTML = `<div class="handle"></div>` + html;
        $("#scrim").hidden = false;
        $("#sheet").hidden = false;
        requestAnimationFrame(() => {
          $("#scrim").classList.add("on");
          $("#sheet").classList.add("on");
        });
        sheetOpen = true;
        if (after) after();
      }
      function closeSheet() {
        if (!sheetOpen) return;
        $("#scrim").classList.remove("on");
        $("#sheet").classList.remove("on");
        sheetOpen = false;
        setTimeout(() => {
          if (!sheetOpen) {
            $("#scrim").hidden = true;
            $("#sheet").hidden = true;
          }
        }, 200);
      }
      function toast(msg) {
        const t = $("#toast");
        t.hidden = false;
        t.textContent = msg;
        t.classList.add("on");
        clearTimeout(t._t);
        t._t = setTimeout(() => {
          t.classList.remove("on");
          setTimeout(() => (t.hidden = true), 220);
        }, 1800);
      }
      function catOptions(sel, kind) {
        return S.settings.cats
          .filter((c) => !kind || c.kind === kind)

      /* ============================== 가져오기 ============================== */

      function sniffDelim(text) {
        const line = text.split("\n").find((l) => l.trim()) || "";
        const tabs = (line.match(/\t/g) || []).length;
        const commas = (line.match(/,/g) || []).length;
        return tabs >= 1 && tabs >= commas / 3 ? "\t" : ",";
      }
      function parseCSV(text, delim) {
        const D = delim || sniffDelim(text);
        const rows = [];
        let row = [],
          cell = "",
          q = false;
        for (let i = 0; i < text.length; i++) {
          const ch = text[i];
          if (q) {
            if (ch === '"') {
              if (text[i + 1] === '"') {
                cell += '"';
                i++;
              } else q = false;
            } else cell += ch;
          } else if (ch === '"') q = true;
          else if (ch === D) {
            row.push(cell);
            cell = "";
          } else if (ch === "\n") {
            row.push(cell);
            rows.push(row);
            row = [];
            cell = "";
          } else if (ch !== "\r") cell += ch;
        }
        if (cell || row.length) {
          row.push(cell);
          rows.push(row);
        }
        return rows;
      }
      const numOf = (s) => {
        const n = Number(String(s || "").replace(/[^0-9.-]/g, ""));
        return isFinite(n) ? n : 0;
      };
      const SUMMARY_LABELS = [
        "수입",
        "지출",
        "투자",
        "잔여 현금",
        "잔여현금",
        "합계",
        "총계",
      ];

      function importPivot(rows, baseYear) {
        // 월 헤더 행 찾기: '8월', '9월(~9.5)' 처럼 '월'이 들어간 셀이 2개 이상인 행
        let hi = -1,
          cols = [];
        rows.forEach((r, i) => {
          const found = [];
          r.forEach((c, j) => {
            const m = String(c).match(/(\d{1,2})\s*월/);
            if (m) found.push({ j, month: Number(m[1]) });
          });
          if (found.length > cols.length) {
            cols = found;
            hi = i;
          }
        });
        if (hi < 0 || !cols.length) return null;
        const out = { months: {}, snaps: {} };
        cols.forEach((col) => {
          const ym = baseYear + "-" + pad2(col.month);
          const items = [];
          const snap = {};
          for (let i = hi + 1; i < rows.length; i++) {
            const label = String(rows[i][col.j - 1] || "").trim();
            const val = numOf(rows[i][col.j]);
            if (!label || !val) continue;
            if (SUMMARY_LABELS.includes(label)) {
              if (label === "투자") snap.invest = val;
              if (label.startsWith("잔여")) snap.cash = val;
              continue;
            }
            const cat = matchCat(label);
            items.push({
              id: uid(),
              d: ym + "-" + pad2(Math.min(28, daysIn(ym))),
              c: cat.id,
              a: val,
              k: cat.kind,
              m: "가져옴 · " + label,
            });
          }
          if (items.length) out.months[ym] = { items };
          if (Object.keys(snap).length) out.snaps[ym] = snap;
        });
        return out;
      }
      function importFlat(rows) {
        const head = rows[0].map((h) => String(h).trim());
        const idx = (n) => head.findIndex((h) => h === n);
        const di = idx("날짜"),
          ci = idx("분류"),
          ai = idx("금액");
        if (di < 0 || ci < 0 || ai < 0) return null;
        const ki = idx("구분"),
          mi = idx("메모"),
          oi = idx("일회성");
        const out = { months: {} };
        rows.slice(1).forEach((r) => {
          const d = String(r[di] || "")
            .trim()
            .replace(/[./]/g, "-");
          if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return;
          const a = numOf(r[ai]);
          if (!a) return;
          const cat = matchCat(String(r[ci] || "").trim());
          const k =
            ki >= 0 ? (String(r[ki]).includes("수입") ? "in" : "ex") : cat.kind;
          const ym = ymOf(d);
          (out.months[ym] = out.months[ym] || { items: [] }).items.push({
            id: uid(),
            d,
            c: cat.id,
            a,
            k,
            m: mi >= 0 ? String(r[mi] || "") : "",
            o: oi >= 0 && /y|Y|true|1|O|о|예/.test(String(r[oi] || "")),
          });
        });
        return Object.keys(out.months).length ? out : null;
      }
      /* 계좌 라벨 → 그룹 id */
      function groupFromLabel(s) {
        const t = String(s).replace(/\s/g, "");
        if (/ISA/i.test(t)) return "isa";
        if (/해외|직투/.test(t)) return "overseas";
        if (/국내/.test(t)) return "domestic";
        if (/연금|IRP/i.test(t)) return "pension";
        if (/청약/.test(t)) return "housing";
        if (/현금|예금/.test(t)) return "cash";
        return "etcinv";
      }
      /* '종목별 포트폴리오' 시트 — 계좌구분·종목명·수량·평단가·현재가 열을 찾아 읽는다.
   오른쪽에 붙은 요약표나 합계 행은 계좌/종목이 비어 있어서 자동으로 걸러진다. */
      /* 머리글 행을 앞쪽 몇 줄에서 찾는다 — 시트에서 범위를 조금 넓게 잡아 복사해도 되도록 */
      function findHead(rows, re) {
        for (let i = 0; i < Math.min(6, rows.length); i++) {
          if (rows[i].some((c) => re.test(String(c).replace(/\s/g, ""))))
            return i;
        }
        return -1;
      }
      function importPortfolio(rows) {
        if (!rows.length) return null;
        const hi = findHead(rows, /종목명/);
        if (hi < 0) return null;
        const head = rows[hi].map((x) => String(x).trim());
        const find = (re) =>
          head.findIndex((h) => re.test(h.replace(/\s/g, "")));
        const iName = find(/종목명/);
        if (iName < 0) return null;
        const iAcct = find(/구분/),
          iQty = find(/수량|보유/),
          iAvg = find(/평단/),
          iSymbol = find(/시세코드|종목코드|티커|ticker|symbol/i);
        let iPrice = find(/현재가|종가/);
        if (iPrice < 0) iPrice = find(/단가/);
        const byGroup = {};
        rows.slice(hi + 1).forEach((r) => {
          const acct = String(r[iAcct] || "").trim(),
            name = String(r[iName] || "").trim();
          if (!acct || !name) return;
          const gid = groupFromLabel(acct);
          (byGroup[gid] = byGroup[gid] || []).push({
            name,
            qty: iQty >= 0 ? numOf(r[iQty]) : 0,
            avg: iAvg >= 0 ? numOf(r[iAvg]) : 0,
            price: iPrice >= 0 ? numOf(r[iPrice]) : 0,
            symbol:
              iSymbol >= 0
                ? normalizeQuoteSymbol(r[iSymbol])
                : inferQuoteSymbol(name),
          });
        });
        return Object.keys(byGroup).length ? { holdings: byGroup } : null;
      }
      /* '투자 월별 평가' 시트 — 월별 스냅샷으로 들어간다 */
      function importInvestMonthly(rows) {
        if (!rows.length) return null;
        const hi = findHead(rows, /누적납입원금|당월투자납입/);
        if (hi < 0) return null;
        const head = rows[hi].map((x) => String(x).replace(/\s/g, ""));
        const col = (re) => head.findIndex((h) => re.test(h));
        const c = {
          contrib: col(/당월.*납입/),
          principal: col(/누적납입원금/),
          isa: col(/ISA/i),
          overseas: col(/해외/),
          domestic: col(/국내/),
          pension: col(/연금/),
          housing: col(/청약/),
          cash: col(/^현금/),
          tex: col(/부동산제외/),
        };
        const snaps = {};
        rows.slice(hi + 1).forEach((r) => {
          const ym = String(r[0] || "")
            .trim()
            .replace(/[./]/g, "-")
            .slice(0, 7);
          if (!/^\d{4}-\d{2}$/.test(ym)) return;
          const g = (k) => (c[k] >= 0 ? numOf(r[c[k]]) : 0);
          const o = {
            at: ym + "-01",
            contrib: g("contrib"),
            principal: g("principal"),
            isa: g("isa"),
            overseas: g("overseas"),
            domestic: g("domestic"),
            pension: g("pension"),
            housing: g("housing"),
            cash: g("cash"),
            etcinv: 0,
            real: 0,
            insure: 0,
            debt: 0,
          };
          o.invest = o.isa + o.overseas + o.domestic + o.pension;
          o.totalExReal =
            c.tex >= 0 ? numOf(r[c.tex]) : o.invest + o.housing + o.cash;
          o.total = o.totalExReal;
          snaps[ym] = o;
        });
        return Object.keys(snaps).length ? { snaps } : null;
      }
      function matchCat(label) {
        const norm = (s) =>
          String(s)
            .replace(/[\s,·.()~]/g, "")
            .toLowerCase();
        const n = norm(label);
        let hit = S.settings.cats.find((c) => norm(c.name) === n);
        if (!hit)
          hit = S.settings.cats.find(
            (c) => n.includes(norm(c.name)) || norm(c.name).includes(n),
          );
        if (hit) return hit;
        const isIncome = /월급|급여|보너스|이자|수입|적립/.test(label);
        const created = {
          id: "c" + uid(),
          name: label.slice(0, 14),
          kind: isIncome ? "in" : "ex",
        };
        S.settings.cats.push(created);
        dirty.add("settings");
        return created;
      }
      function openImport() {

          () => {

      function allItems() {

          .flatMap(([ym, d]) => (d.items || []).map((i) => ({ ...i, ym })))
          .sort((a, b) => a.d.localeCompare(b.d));

      function itemsCSV(items) {
        const head = "날짜,구분,분류,금액,메모,일회성";
        const q = (s) =>
          /[",\n]/.test(String(s))
            ? '"' + String(s).replace(/"/g, '""') + '"'
            : String(s);
        return (
          "﻿" +
          head +
          "\n" +
          items
            .map((i) =>
              [
                i.d,
                i.k === "in" ? "수입" : "지출",
                catById(i.c).name,
                i.a,
                i.m || "",
                i.o ? "Y" : "",
